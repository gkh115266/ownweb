<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeamin - Contact Details 🚀</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 15px;
            min-height: 100vh;
        }

        .card-container {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.15);
            overflow: hidden;
            border-top: 5px solid #8b0000;
            animation: fadeIn 0.6s ease-in-out;
        }

        .hero-header {
            background: linear-gradient(135deg, #5c0000, #8b0000, #b22222);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .hero-header h2 {
            font-weight: 800;
            margin-bottom: 5px;
        }

        .hero-header p {
            color: #ffd700;
            font-weight: 600;
            margin-bottom: 6px;
        }

        /* Contact Details Header Styling */
        .contact-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            display: inline-block;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .content-body {
            padding: 30px;
        }

        .form-select {
            border: 2px solid #f5c6cb;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-select:focus {
            border-color: #8b0000;
            box-shadow: 0 0 0 0.25rem rgba(139, 0, 0, 0.25);
        }

        /* Copy Box Style */
        .info-box {
            background: #fff0f0;
            border: 2px dashed #b22222;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            animation: popIn 0.3s ease-in-out;
        }

        .info-text {
            font-weight: 700;
            color: #5c0000;
            font-size: 15px;
            word-break: break-all;
        }

        /* Copy Button & Animation */
        .btn-copy {
            background: #8b0000;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #5c0000;
            transform: translateY(-2px);
        }

        /* Click Copy Success Animation */
        .btn-copy.copied {
            background: #2e7d32 !important; /* Green color */
            animation: bounce 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="hero-header">
        <h2>👑 Yeamin</h2>
        <p>💻 Web Developer || 🛡️ Ethical Expert</p>
        <span class="contact-title">📩 Contact Details</span>
    </div>

    <div class="content-body">
        <label class="form-label fw-bold text-danger">⚙️ প্ল্যাটফর্ম বেছে নিন (Select Platform):</label>
        <select id="platformSelect" class="form-select">
            <option value="" selected disabled>-- অপশন সিলেক্ট করুন 👇 --</option>
            <option value="facebook">📘 Facebook ID</option>
            <option value="telegram">✈️ Telegram Username</option>
            <option value="tiktok">🎵 TikTok IDs</option>
        </select>

        <!-- Dynamic Details Boxes -->
        
        <!-- Facebook Field -->
        <div class="info-group d-none" id="facebookField">
            <div class="info-box">
                <span class="info-text" id="fbValue">@yeamin3k</span>
                <button type="button" class="btn-copy" onclick="copyToClipboard('fbValue', this)">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
        </div>

        <!-- Telegram Field -->
        <div class="info-group d-none" id="telegramField">
            <div class="info-box">
                <span class="info-text" id="tgValue">@yeamin3k</span>
                <button type="button" class="btn-copy" onclick="copyToClipboard('tgValue', this)">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
        </div>

        <!-- TikTok Field (Two IDs: yeamint69 on top) -->
        <div class="info-group d-none" id="tiktokField">
            <!-- First TikTok ID -->
            <div class="info-box">
                <div>
                    <small class="text-muted d-block fw-bold" style="font-size: 11px;">PRIMARY ID</small>
                    <span class="info-text" id="ttValue1">@yeamint69</span>
                </div>
                <button type="button" class="btn-copy" onclick="copyToClipboard('ttValue1', this)">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
            
            <!-- Second TikTok ID -->
            <div class="info-box">
                <div>
                    <small class="text-muted d-block fw-bold" style="font-size: 11px;">SECONDARY ID</small>
                    <span class="info-text" id="ttValue2">@yeamin3k</span>
                </div>
                <button type="button" class="btn-copy" onclick="copyToClipboard('ttValue2', this)">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    // 1. Dropdown Selection Logic
    const select = document.getElementById('platformSelect');
    const fields = {
        facebook: document.getElementById('facebookField'),
        telegram: document.getElementById('telegramField'),
        tiktok: document.getElementById('tiktokField')
    };

    select.addEventListener('change', function () {
        const val = this.value;
        
        // Hide all fields first
        Object.values(fields).forEach(f => f.classList.add('d-none'));

        // Show only the selected platform
        if (fields[val]) {
            fields[val].classList.remove('d-none');
        }
    });

    // 2. Fast Copy to Clipboard Function with Animation
    function copyToClipboard(elementId, btn) {
        const textToCopy = document.getElementById(elementId).innerText;

        // Copy process
        const tempInput = document.createElement("input");
        tempInput.value = textToCopy;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        // Animation & Text Feedback
        const oldHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        btn.classList.add('copied');

        setTimeout(() => {
            btn.innerHTML = oldHtml;
            btn.classList.remove('copied');
        }, 1800);
    }
</script>

</body>
</html>
